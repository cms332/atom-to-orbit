name: A2O CI

on:
  push:
    branches: [main, master, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      # Official action revisions verified on 2026-10-21. No deployment credentials.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Type check
        run: bun run check
      - name: Lint and format
        run: bun run lint
      - name: Unit tests
        run: bun run test
      - name: Static build
        run: bun run build
      - name: Install test browser
        run: bunx playwright install --with-deps chromium
      - name: Article, navigation and orbit smoke tests
        run: bun run test:e2e -- tests/site.spec.ts tests/motion-article.spec.ts tests/article-format.spec.ts tests/analytics.spec.ts tests/orbit-finale.spec.ts tests/atomic-space.spec.ts tests/atomic-scale.spec.ts tests/earth-moon.spec.ts
