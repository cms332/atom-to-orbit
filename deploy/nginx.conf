worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml application/xml;
    map $sent_http_content_type $content_cache {
        default "public, max-age=3600, must-revalidate";
        ~text/html "no-cache";
    }
    map $uri $path_cache {
        default $content_cache;
        /healthz "no-store";
        /build-info.json "no-store";
        ~^/_app/immutable/ "public, max-age=31536000, immutable";
    }
    map $status $a2o_cache {
        default $path_cache;
        ~^[45] "no-store";
    }
    map $uri $font_license {
        default "";
        ~*\.woff2?$ '</fonts/OFL.txt>; rel="license"';
    }
    server {
        listen 8080 default_server;
        server_name a2o.kr www.a2o.kr;
        root /usr/share/nginx/html;
        index index.html;
        absolute_redirect off;
        add_header Cache-Control $a2o_cache always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Link $font_license always;
        if ($host = www.a2o.kr) { return 308 https://a2o.kr$request_uri; }
        location = /healthz {
            default_type application/json;
            alias /usr/share/nginx/html/build-info.json;
        }
        location / { try_files $uri $uri/ =404; }
        error_page 404 /404.html;
    }
}
