name: web-analytics
services:
  db:
    image: ${POSTGRES_IMAGE:?Set a verified PostgreSQL image digest}
    container_name: analytics-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: analytics_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      TZ: UTC
    command: ['postgres', '-c', 'shared_buffers=128MB', '-c', 'max_connections=40']
    volumes:
      - analytics-data:/var/lib/postgresql/data
    networks: [database]
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U analytics_admin -d postgres']
      interval: 5s
      timeout: 3s
      retries: 20
    logging: { driver: json-file, options: { max-size: 10m, max-file: '3' } }
  umami:
    image: ${UMAMI_IMAGE:?Set a verified Umami image digest}
    container_name: analytics-umami
    restart: unless-stopped
    init: true
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: ${DATABASE_URL:?}
      APP_SECRET: ${APP_SECRET:?}
      TWO_FACTOR_ENCRYPTION_KEY: ${TWO_FACTOR_ENCRYPTION_KEY:?}
      DISABLE_TELEMETRY: '1'
      PRIVATE_MODE: '1'
      CLIENT_IP_HEADER: x-real-ip
      SALT_ROTATION: day
      TZ: UTC
    ports: ['127.0.0.1:4371:3000']
    networks: [database, web]
    mem_limit: 1g
    cpus: 1
    pids_limit: 256
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/heartbeat').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 12
    logging: { driver: json-file, options: { max-size: 10m, max-file: '3' } }
volumes:
  analytics-data:
    name: analytics-postgres-data
networks:
  database:
    name: analytics-database
    internal: true
  web:
    name: analytics-web
    external: true
